name: CI

# Pull requests, and pushes to main.
#
# `push` was unrestricted here once, which fired alongside `pull_request` for
# the same branch and ran this job twice per change; scoping it to main fixes
# that -- a pull request gets one run, and the merge gets a separate run on
# different content.
#
# The comment this replaces said a push to main was "already covered by the
# deploy workflow, which runs the same gates". That was false, and it is the
# gap this trigger closes: the deploy runs audit, lint, unit tests and the
# build, but no deploy in any of the three sibling repos runs a browser suite.
# Those live only here, so without a push trigger nothing browser-level ever
# ran against main.
#
# This workflow deploys nothing. If it goes red the site still publishes, which
# is the reason the browser suites belong here rather than in the deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      # typecheck -> lint -> test -> build, chained so the first failure stops
      # it. The same command developers run locally.
      - name: Verify
        run: npm run verify

      # Playwright has to be installed before anything that drives a browser,
      # and the cache restore has to come before the install or it saves
      # nothing. web-xiangqi learned both of those the hard way.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Not in `verify`: it builds the app, starts a preview server and drives a
      # real browser, which is minutes rather than seconds and needs a browser
      # installed. Kept out of the local gate for the same reason web-katrain
      # keeps its viewport check out of one.
      - name: Browser UI checks
        run: npm run test:ui:browser

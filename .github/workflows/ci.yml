name: CI

# Pull requests, and pushes to main.
#
# `push` was unrestricted here once, which fired alongside `pull_request` for
# the same branch and ran this job twice per change; scoping it to main fixes
# that -- a pull request gets one run, and the merge gets a separate run on
# different content.
#
# This workflow verifies pull requests and main without deploying. The Pages
# workflow also runs the browser gate before uploading its own build, so a
# failure there prevents publishing even though these workflows run separately.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      # typecheck -> lint -> test -> build, chained so the first failure stops
      # it. The same command developers run locally.
      - name: Verify
        run: npm run verify

      # Playwright has to be installed before anything that drives a browser,
      # and the cache restore has to come before the install or it saves
      # nothing. web-xiangqi learned both of those the hard way.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Not in `verify`: it builds the app, starts a preview server and drives a
      # real browser, which is minutes rather than seconds and needs a browser
      # installed. Kept out of the local gate for the same reason web-katrain
      # keeps its viewport check out of one.
      - name: Browser UI checks
        run: npm run test:ui:browser

name: CI

# The deploy workflow runs the checks, but only on a push to main — which is
# also when it publishes. That left a pull request with no verification at all,
# and made "the checks passed" and "it is live" the same event. This runs the
# same gates on every branch and pull request, and deploys nothing.
# Pull requests only. Adding a `push` trigger as well fired both events for a
# branch in this repo and ran everything twice per change. A push to main is
# already covered by the deploy workflow, which runs the same gates.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      # typecheck -> lint -> test -> build, chained so the first failure stops
      # it. The same command developers run locally.
      - name: Verify
        run: npm run verify

      # Playwright has to be installed before anything that drives a browser,
      # and the cache restore has to come before the install or it saves
      # nothing. web-xiangqi learned both of those the hard way.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Not in `verify`: it builds the app, starts a preview server and drives a
      # real browser, which is minutes rather than seconds and needs a browser
      # installed. Kept out of the local gate for the same reason web-katrain
      # keeps its viewport check out of one.
      - name: Browser UI checks
        run: npm run test:ui:browser

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description"
    content="Web Chess — play, analyze and review your games with Stockfish right in the browser." />
  <title>Web Chess</title>
  <script type="module">
    // Registered for two reasons now: cross-origin isolation, which is what
    // makes multi-threaded Stockfish reachable on a host that cannot send
    // COOP/COEP, and offline support. Both live in public/sw.js, because a
    // second worker at this scope would replace the first and take isolation
    // away with no error anywhere.
    const coiServiceWorker = {
      url: new URL('%BASE_URL%sw.js', window.location.origin).toString(),
      scope: '%BASE_URL%',
      coepCredentialless: () => !(window.chrome || window.netscape),
      shouldRegister: () => window.isSecureContext && window.crossOriginIsolated === false,
      shouldDeregister: () => false,
      doReload: () => window.location.reload(),
    }
    let coiReloadPending = false

    const reloadForCrossOriginIsolation = () => {
      if (coiReloadPending) return
      coiReloadPending = true
      coiServiceWorker.doReload()
    }

    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'coepCredentialless',
        value: coiServiceWorker.coepCredentialless(),
      })

      if (coiServiceWorker.shouldDeregister()) {
        navigator.serviceWorker.controller.postMessage({ type: 'deregister' })
      }
    }

    // Never in dev. Vite extracts this inline module into the bundle, so
    // `import.meta.env` is substituted here like anywhere else. A caching
    // worker in front of the dev server caches every module request -- each
    // one a distinct URL because of the `?t=` HMR timestamp -- which fills the
    // cache with garbage and can serve a stale module after an edit. The old
    // registration avoided this by accident: it only ran when the page was
    // *not* already isolated, and the dev server sends the headers itself.
    if (!import.meta.env.DEV && 'serviceWorker' in navigator && window.isSecureContext) {
      // The worker is registered whether or not the page is already isolated:
      // on a host that sends the headers itself there is nothing to fix, but
      // the offline cache still wants filling. Only the reload-to-become-
      // isolated dance is conditional, because a page that is already isolated
      // must not reload itself in a loop.
      const needsIsolation = coiServiceWorker.shouldRegister()
      if (needsIsolation) {
        navigator.serviceWorker.addEventListener('controllerchange', reloadForCrossOriginIsolation)
      }

      navigator.serviceWorker.register(coiServiceWorker.url, { scope: coiServiceWorker.scope }).then(registration => {
        if (!needsIsolation) return
        registration.addEventListener('updatefound', reloadForCrossOriginIsolation)

        if (registration.active && !navigator.serviceWorker.controller) {
          reloadForCrossOriginIsolation()
        }
      }).catch(() => {
        // Isolation is a performance upgrade and offline is a convenience;
        // keep the app usable if registration fails.
      })
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

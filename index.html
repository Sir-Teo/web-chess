<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description"
    content="Web Chess — play, analyze and review your games with Stockfish right in the browser." />
  <title>Web Chess</title>
  <style>
    /* Painted with this file, so it needs nothing that is still downloading.
       The board arrives when 214kB of stylesheet and JavaScript have landed
       and React has mounted: measured on the production build at 390x844,
       1651ms behind a 4G connection and 5446ms behind a 3G one, every one of
       them a blank screen with no brand, no shape and no sign of progress.
       The colours are the app's own defaults, and the page is already dark
       before its stylesheet by way of the color-scheme meta above, so nothing
       here changes what a reader sees once the real thing is up.

       React's createRoot replaces everything inside #root on its first render,
       so this needs no script to take it away.

       The delay is the point of the opacity: a warm cache paints the real
       board in about 110ms, and a skeleton that flashed by underneath it would
       be worse than the nothing it replaces. 150ms clears that and no more --
       the clock does not start until the render-blocking stylesheet has landed
       and styles first resolve, so every millisecond of it is taken off the
       far end, where the wait actually is. */
    .boot {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      opacity: 0;
      animation: boot-in 0.25s ease 0.15s forwards;
    }

    .boot-board {
      width: min(93vw, 26rem);
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: rgba(255, 255, 255, 0.02);
      /* One conic gradient with hard stops, not the two 45deg ones the recipe
         for a checkerboard usually gives: those paint triangles, and at this
         contrast the seam down every square reads as a bevel rather than as a
         board. A cone quartered at a tile of 2x2 squares is an eighth of the
         board each way. */
      background-image: conic-gradient(
        rgba(255, 255, 255, 0.05) 0 25%,
        transparent 0 50%,
        rgba(255, 255, 255, 0.05) 0 75%,
        transparent 0);
      background-size: 25% 25%;
    }

    .boot-name {
      margin: 0;
      font: 600 0.95rem/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(242, 243, 245, 0.42);
      animation: boot-pulse 1.8s ease-in-out infinite;
    }

    @keyframes boot-in {
      to { opacity: 1; }
    }

    @keyframes boot-pulse {
      50% { color: rgba(242, 243, 245, 0.78); }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-name { animation: none; }
    }
  </style>
  <script type="module">
    // Registered for two reasons now: cross-origin isolation, which is what
    // makes multi-threaded Stockfish reachable on a host that cannot send
    // COOP/COEP, and offline support. Both live in public/sw.js, because a
    // second worker at this scope would replace the first and take isolation
    // away with no error anywhere.
    const coiServiceWorker = {
      url: new URL('%BASE_URL%sw.js', window.location.origin).toString(),
      scope: '%BASE_URL%',
      coepCredentialless: () => !(window.chrome || window.netscape),
      shouldRegister: () => window.isSecureContext && window.crossOriginIsolated === false,
      shouldDeregister: () => false,
      doReload: () => window.location.reload(),
    }
    let coiReloadPending = false

    const reloadForCrossOriginIsolation = () => {
      if (coiReloadPending) return
      coiReloadPending = true
      coiServiceWorker.doReload()
    }

    if (navigator.serviceWorker?.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'coepCredentialless',
        value: coiServiceWorker.coepCredentialless(),
      })

      if (coiServiceWorker.shouldDeregister()) {
        navigator.serviceWorker.controller.postMessage({ type: 'deregister' })
      }
    }

    // Never in dev. Vite extracts this inline module into the bundle, so
    // `import.meta.env` is substituted here like anywhere else. A caching
    // worker in front of the dev server caches every module request -- each
    // one a distinct URL because of the `?t=` HMR timestamp -- which fills the
    // cache with garbage and can serve a stale module after an edit. The old
    // registration avoided this by accident: it only ran when the page was
    // *not* already isolated, and the dev server sends the headers itself.
    if (!import.meta.env.DEV && 'serviceWorker' in navigator && window.isSecureContext) {
      // The worker is registered whether or not the page is already isolated:
      // on a host that sends the headers itself there is nothing to fix, but
      // the offline cache still wants filling. Only the reload-to-become-
      // isolated dance is conditional, because a page that is already isolated
      // must not reload itself in a loop.
      const needsIsolation = coiServiceWorker.shouldRegister()
      if (needsIsolation) {
        navigator.serviceWorker.addEventListener('controllerchange', reloadForCrossOriginIsolation)
      }

      navigator.serviceWorker.register(coiServiceWorker.url, { scope: coiServiceWorker.scope }).then(registration => {
        if (!needsIsolation) return
        registration.addEventListener('updatefound', reloadForCrossOriginIsolation)

        if (registration.active && !navigator.serviceWorker.controller) {
          reloadForCrossOriginIsolation()
        }
      }).catch(() => {
        // Isolation is a performance upgrade and offline is a convenience;
        // keep the app usable if registration fails.
      })
    }
  </script>
</head>

<body>
  <div id="root">
    <div class="boot" aria-hidden="true">
      <div class="boot-board"></div>
      <p class="boot-name">Web Chess</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
